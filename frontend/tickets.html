<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupportAI - Tickets</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

<!-- Sidebar -->
<aside class="fixed left-0 top-0 h-screen w-64 bg-slate-900 text-white flex flex-col">

    <div class="h-16 px-6 flex items-center">
        <span class="text-xl font-bold">SupportAI</span>
    </div>

    <nav class="px-4 mt-4 space-y-2">

        <a href="dashboard.html"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
            Dashboard
        </a>

        <a href="tickets.html"
           class="flex items-center gap-3 px-4 py-3 rounded-lg bg-blue-600">
            Tickets
        </a>

        <a href="index.html"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
            Bulk Upload
        </a>

        <a href="analytics.html"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
            Analytics
        </a>

        <a href="index.html"
           class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">
            Knowledge Base
        </a>

    </nav>

</aside>


<!-- Main Content -->
<div class="ml-64">

    <!-- Header -->
    <header class="h-16 bg-white border-b flex items-center justify-between px-8">

        <div>
            <h1 class="text-xl font-semibold">
                Ticket Queue
            </h1>

            <p class="text-sm text-slate-500">
                AI-classified customer support tickets
            </p>
        </div>

        <button
            onclick="loadTickets()"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Refresh
        </button>

    </header>


    <!-- Content -->
    <main class="p-8">

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">

            <div class="bg-white p-5 rounded-xl border">
                <p class="text-sm text-slate-500">Total Tickets</p>
                <p id="totalTickets" class="text-3xl font-bold mt-2">0</p>
            </div>

            <div class="bg-white p-5 rounded-xl border">
                <p class="text-sm text-slate-500">P1 Urgent</p>
                <p id="p1Tickets" class="text-3xl font-bold text-red-600 mt-2">0</p>
            </div>

            <div class="bg-white p-5 rounded-xl border">
                <p class="text-sm text-slate-500">P2 High</p>
                <p id="p2Tickets" class="text-3xl font-bold text-orange-500 mt-2">0</p>
            </div>

            <div class="bg-white p-5 rounded-xl border">
                <p class="text-sm text-slate-500">Negative Sentiment</p>
                <p id="negativeTickets" class="text-3xl font-bold text-purple-600 mt-2">0</p>
            </div>

        </div>


        <!-- Ticket Table -->
        <div class="bg-white rounded-xl border overflow-hidden">

            <div class="p-5 border-b flex justify-between items-center">

                <div>
                    <h2 class="font-semibold text-lg">
                        All Tickets
                    </h2>

                    <p class="text-sm text-slate-500">
                        Live data from FastAPI backend
                    </p>
                </div>

                <span
                    id="connectionStatus"
                    class="text-sm text-green-600">
                    ● Connected
                </span>

            </div>


            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-slate-50 border-b">

                        <tr>

                            <th class="px-6 py-4 text-sm font-semibold">
                                ID
                            </th>

                            <th class="px-6 py-4 text-sm font-semibold">
                                Subject
                            </th>

                            <th class="px-6 py-4 text-sm font-semibold">
                                Category
                            </th>

                            <th class="px-6 py-4 text-sm font-semibold">
                                Priority
                            </th>

                            <th class="px-6 py-4 text-sm font-semibold">
                                Sentiment
                            </th>

                            <th class="px-6 py-4 text-sm font-semibold">
                                Confidence
                            </th>

                        </tr>

                    </thead>

                    <tbody id="ticketTable"
                           class="divide-y">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";


async function loadTickets() {

    const table = document.getElementById("ticketTable");

    const status = document.getElementById("connectionStatus");

    try {

        status.textContent = "● Loading...";
        status.className = "text-sm text-blue-600";


        const response = await fetch(`${API_URL}/tickets/`);

        if (!response.ok) {
            throw new Error("Backend request failed");
        }


        const tickets = await response.json();


        table.innerHTML = "";


        let p1 = 0;
        let p2 = 0;
        let negative = 0;


        tickets.forEach(ticket => {

            if (ticket.priority === "P1") {
                p1++;
            }

            if (ticket.priority === "P2") {
                p2++;
            }

            if (ticket.sentiment === "negative") {
                negative++;
            }


            const row = document.createElement("tr");

            row.className = "hover:bg-slate-50";
            row.style.cursor = "pointer";
            row.dataset.id = String(ticket.id);
            row.addEventListener("click", function () {
                window.location.href = `ticket-detail.html?id=${row.dataset.id}`;
            });


            let priorityClass = "bg-slate-100 text-slate-700";

            if (ticket.priority === "P1") {
                priorityClass = "bg-red-100 text-red-700";
            }

            else if (ticket.priority === "P2") {
                priorityClass = "bg-orange-100 text-orange-700";
            }


            let sentimentClass = "bg-slate-100 text-slate-700";

            if (ticket.sentiment === "negative") {
                sentimentClass = "bg-red-100 text-red-700";
            }

            else if (ticket.sentiment === "positive") {
                sentimentClass = "bg-green-100 text-green-700";
            }


            const confidence =
                ticket.confidence != null
                ? (ticket.confidence * 100).toFixed(1) + "%"
                : "-";


            row.innerHTML = `

                <td class="px-6 py-4 mono text-sm">
                    #${ticket.id}
                </td>

                <td class="px-6 py-4">
                    <div class="font-medium">
                        ${ticket.subject}
                    </div>

                    <div class="text-xs text-slate-500 mt-1">
                        ${ticket.customer_tier || "standard"}
                    </div>
                </td>

                <td class="px-6 py-4">

                    <span class="px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-medium">
                        ${ticket.category || "-"}
                    </span>

                </td>

                <td class="px-6 py-4">

                    <span class="px-3 py-1 rounded-full ${priorityClass} text-xs font-medium">
                        ${ticket.priority || "-"}
                    </span>

                </td>

                <td class="px-6 py-4">

                    <span class="px-3 py-1 rounded-full ${sentimentClass} text-xs font-medium">
                        ${ticket.sentiment || "-"}
                    </span>

                </td>

                <td class="px-6 py-4 mono text-sm">
                    ${confidence}
                </td>

            `;


            table.appendChild(row);

        });


        document.getElementById("totalTickets").textContent = tickets.length;
        document.getElementById("p1Tickets").textContent = p1;
        document.getElementById("p2Tickets").textContent = p2;
        document.getElementById("negativeTickets").textContent = negative;


        status.textContent = "● Connected";
        status.className = "text-sm text-green-600";


    }

    catch (error) {

        console.error(error);

        status.textContent = "● Connection Failed";
        status.className = "text-sm text-red-600";


        table.innerHTML = `

            <tr>

                <td colspan="6"
                    class="px-6 py-10 text-center text-red-500">

                    Unable to load tickets from backend.

                </td>

            </tr>

        `;

    }

}


// Load tickets when page opens
loadTickets();

</script>

</body>
</html>
